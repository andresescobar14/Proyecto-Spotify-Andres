<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/styles.css">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="grid grid-rows-[31px_auto_45px] h-screen bg-[black] text-white">
  <header class="header grid grid-cols-[15%_50%_auto] text-white flex justify-between items-center h-[7vh]">
    <div class="left">
      <i class="fa-brands fa-spotify text-white flex justify-center items-center px-[14px] py-[8px]"></i>
    </div>
    <div class="center flex items-center gap-1 justify-center ml-18">
      <button class="home bg-[#1f1f1f] rounded-full border-none w-6 h-6 hover:text-white transition-colors duration-200"> 
        <i class="fa-regular fa-house fa-xs text-[#adadad] hover:text-white transition-colors duration-200"></i>
      </button>
        <div class="busqueda group bg-[#1f1f1f] hover:bg-[#2a2a2a] border-transparent hover:border-white rounded-full text-[8px] text-[#b2b2b2] flex items-center w-[25vw] h-[23px] px-[6px] py-[8px] gap-1 justify-between transition-all duration-200 cursor-pointer">
          <div class="left-input flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass border-none bg-[#1f1f1f] text-[#adadad]"></i>
          <input text="search" placeholder="¿Que quieres reproducir?" class="input bg-[#1f1f1f] outline-none font-medium text-white">
          </div>
          <div class="right-input flex items-center gap-1 px-1">
          <div class="divisor w-[1px] h-[15px] bg-[#494949] mx-1">
          </div>
          <i class="fa-solid fa-laptop text-[#adadad]"></i>
          </div>
        </div>
        </div>
    <div class="right flex gap-3 px-2">
      <div class="buttons flex items-center justify-center">
      <button class="Premium bg-[white] text-black font-bold text-[7px] rounded-full w-[8vw] h-[15px] hover:bg-[black-100] transition-colors duration-200]">
        Descubrir Premium
      </button>
      <button class="bg-[transparent] text-gray-300 text-[7px] font-semibold w-[6vw] h-[15px] hover:text-white transition-colors duration-200">
        <i class="fa-solid fa-download fa-2xs text-[#adadad]"></i> Instalar app
      </button>
      </div>
      <div class="info flex items-center justify-center gap-2">
      <i class="fa-solid fa-bell fa-2xs text-[#adadad] hover:text-white transition-colors duration-200"></i>
      <i class="fa-solid fa-people-group fa-2xs text-[#adadad] hover:text-white transition-colors duration-200"></i>
      <i class="fa-regular fa-circle-user fa-2xs text-[#adadad] hover:text-white transition-colors duration-200]"></i>
      </div>
    </div>
  </header>
  <section class="main-content grid grid-cols-[1fr_650px_140px] h-full w-full gap-1 px-1">
    <aside class="sidebar-left bg-[#121212] border-none rounded-sm py-1 px-2 flex flex-col">
      <div class="aside-top flex items-center justify-between">
        <h2 class="title text-[8px] font-bold tracking-tight">Tu biblioteca</h2>
        <div class="buttons flex gap-2">
        <button class="plus border-none rounded-full bg-[#1f1f1f] h-6 w-6"><i class="fa-solid fa-plus fa-2xs text-[#adadad]"></i></button>
        <button class="enlarge"><i class="fa-solid fa-up-right-and-down-left-from-center fa-2xs text-[#adadad]"></i></button>
        </div>
      </div>  
      <div class="listas">
        <button class="text-[7px] p-1 font-medium rounded-full bg-[#2a2a2a] w-8 text-center">Listas</button>
        <button class="text-[7px] p-1 rounded-full font-medium bg-[#2a2a2a] w-10">Albumes</button>
      </div>
      <div class="busqueda-b flex items-center justify-between">
        <button class="border-none rounded-full"><i class="fa-solid fa-magnifying-glass fa-2xs border-none text-[#a3a3a3]"></i></button>
        <button class="Recientes text-[7px] text-[#adadad]">Recientes <i class="fa-solid fa-list-ul text-[#adadad]"></i></button>
      </div>
      <div class="grid-aside-left grid grid-rows-[1fr_1fr] mt-1 gap-2 w-full">
        <div class="flex items-center gap-2 hover:bg-[#2a2a2a] p-1 -mx-1 -my-1 transition-colors duration-200 cursor-pointer rounded-md">
          <img src="images.jpg" class="object-cover w-[25px] h-[25px] rounded-sm">
          <div class="parrafo flex flex-col justify-center">
            <h2 class="text-[9px] font-medium text-[#5db480]">Andress</h2>
            <p class="text-[7px] font-semibold text-[#b5b5b5]">Lista • Andres</p>
          </div>
        </div>
          <div class="flex items-center gap-2 hover:bg-[#2a2a2a] p-1 -mx-1 -my-1 transition-colors duration-200 cursor-pointer rounded-md">
          <img src="images (1).jpg" class="object-cover w-[25px] h-[25px] rounded-sm">
          <div class="parrafo flex flex-col justify-center">
            <h2 class="text-[9px] font-medium text-[white]">Canciones que te gustan</h2>
            <p class="text-[7px] font-semibold text-[#b5b5b5]">Lista • 6 canciones</p>
          </div>
        </div>
          <div class="flex items-center gap-2 hover:bg-[#2a2a2a] p-1 -mx-1 -my-1 transition-colors duration-200 cursor-pointer rounded-md ">
            <img src="images (2).jpg" class="object-cover w-[25px] h-[25px] rounded-sm">
            <div class="parrafo flex flex-col justify-center min-w-0 flex-1">
              <h2 class="text-[9px] font-medium text-[white] truncate">Shakira: Bzrp Music Sessions YT</h2>
              <p class="text-[7px] font-semibold text-[#b5b5b5] truncate">Sencillo • Bizarrap</p>
            </div>
          </div>
      </div>
    </aside>
    <main class="content bg-[#121212] border-none rounded-md">
      <section class="overflow-y-auto bg-gradient-to-b from-[#292929] from-40% to-black to-60%">
        <div class=" relative">
          <img src="images (3).jpg" alt="fondo" class=" h-[40vh] w-[100vw]">
          <div class="absolute bottom-0 left-0 flex flex-col p-3 text-white">
            <h2 class="font-extrabold text-[50px]">Web</h2>
            <p class="text-[9px] font-light">53.711 oyentes mensuales</p>
          </div>
        </div>
        <div class="section-2 p-4  h-[60vh] w-[100vw]]">
          <div class="options-section2 flex items-center gap-4">
            <button class="p-2 rounded-full bg-[#20d761]">
              <svg data-encore-id="icon" role="img" aria-hidden="true" class="e-10451-icon h-3 w-3" viewBox="0 0 24 24" style="--encore-icon-height: var(--encore-graphic-size-decorative-base); --encore-icon-width: var(--encore-graphic-size-decorative-base);"><path d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606"></path></svg>
            </button>
            <svg data-encore-id="icon" role="img" aria-hidden="true" class="e-10451-icon w-5 h-5" viewBox="0 0 24 24" style="--encore-icon-height: var(--encore-graphic-size-decorative-larger); --encore-icon-width: var(--encore-graphic-size-decorative-larger);"><path d="M18.788 3.702a1 1 0 0 1 1.414-1.414L23.914 6l-3.712 3.712a1 1 0 1 1-1.414-1.414L20.086 7h-1.518a5 5 0 0 0-3.826 1.78l-7.346 8.73a7 7 0 0 1-5.356 2.494H1v-2h1.04a5 5 0 0 0 3.826-1.781l7.345-8.73A7 7 0 0 1 18.569 5h1.518l-1.298-1.298z"></path><path d="M18.788 14.289a1 1 0 0 0 0 1.414L20.086 17h-1.518a5 5 0 0 1-3.826-1.78l-1.403-1.668-1.306 1.554 1.178 1.4A7 7 0 0 0 18.568 19h1.518l-1.298 1.298a1 1 0 1 0 1.414 1.414L23.914 18l-3.712-3.713a1 1 0 0 0-1.414 0zM7.396 6.49l2.023 2.404-1.307 1.553-2.246-2.67a5 5 0 0 0-3.826-1.78H1v-2h1.04A7 7 0 0 1 7.396 6.49"></path></svg>
            <button class="bg-transparent rounded-lg w-10 h-4 border-1 border-gray text-[7px] font-bold ">Seguir</button>
            <svg data-encore-id="icon" role="img" aria-hidden="true" class="e-10451-icon w-4 h-4 fill-[#4c4c4c]" viewBox="0 0 24 24" style="--encore-icon-height: var(--encore-graphic-size-decorative-larger); --encore-icon-width: var(--encore-graphic-size-decorative-larger);"><path fill="currentColor" d="M4.5 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m15 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m-7.5 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"></path></svg>
          </div>
          <div>
          <h2 class="font-bold text-[15px]">Populares</h2>
          <div class="grid grid-rows-5">
            
          </div>
          </div>
        </div>
      </section>
    </main>
    <aside class="now-playing bg-[#121212] border-none rounded-md">...</aside>
  </section>
  </main>
</body>
</html>
